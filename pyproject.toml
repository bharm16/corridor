[project]
name = "corridor"
version = "0.1.0"
description = "A cited system of record for external-party readiness on highway projects"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.2",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corridor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
