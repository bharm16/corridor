[project]
name = "corridor"
version = "0.1.0"
description = "Coordination records with cited sources for highway construction constraints and commitments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.2",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.1",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corridor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exhaustive acceptance, migration, or real-corpus rehearsal",
]

[tool.ruff.lint]
# Start with correctness checks that are clean across the existing source.
# Architecture-specific interface rules live in tests/test_architecture.py.
select = ["E9", "F63", "F7", "F811", "F821"]
