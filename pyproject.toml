[project]
name = "corridor"
version = "0.1.0"
description = "Coordination records with cited sources for highway construction constraints and commitments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.2",
    # Retired by ADR-0094 and removed from the product by #741 everywhere
    # except the legacy matrix extraction path, which reads table geometry
    # through it (`geometry.py`, `extract_matrix.py`, `gold.py`). That path
    # leaves when the deployed Matrix route moves to the paired-rendition
    # reader's own cell-ID semantics; `ENGINE_ALLOWLIST` in
    # tests/test_architecture.py is the exact remaining list.
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.1",
    "weasyprint>=69.0",
    "python-calamine>=0.5.3",
    "shapely>=2.1",
    "boto3>=1.43.87",
    # The measured paired-rendition reader's engines, pinned to the versions
    # it was measured with (#729, ADR-0006). pypdfium2 and pypdf are the
    # reader; pdf-oxide is declared only because the imported reader names it
    # for its alternative engines, and the measured `tagged` engine never
    # imports it.
    "pypdfium2==5.13.0",
    "pypdf==6.17.0",
    "pdf-oxide==0.3.77",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.3",
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13",
    "mypy>=2.3",
]
# Answer-key building for the reader's reproduction experiment only
# (`make pdf-reader-reproduce`); routine `uv sync` and CI never install it.
pdf-reader-experiment = [
    "xlrd==2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corridor", "src/corridor_pdf_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exhaustive acceptance, migration, or real-corpus rehearsal",
    "migration: database upgrade tests selected only for schema-sensitive changes",
]

[tool.mypy]
# `make check` type-checks the imported reader package only, under the
# settings its source repository held it to (#729). src/corridor is not
# checked: the modules the package reaches there are followed silently.
python_version = "3.12"
files = ["src/corridor_pdf_reader"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "corridor_pdf_reader.*"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "corridor.*"
follow_imports = "silent"

# The source repository checked `replacement/` in an environment without
# pypdf installed, so pypdf was `Any` to it; pypdf 6.17 ships annotations
# that three lines of the unchanged tags.py do not satisfy. Skipping pypdf
# reproduces the check the reader was measured under rather than editing it.
[[tool.mypy.overrides]]
module = "pypdf.*"
follow_imports = "skip"

[tool.ruff.lint]
# Start with correctness checks that are clean across the existing source.
# Architecture-specific interface rules live in tests/test_architecture.py.
select = ["E9", "F63", "F7", "F811", "F821"]
