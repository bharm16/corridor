<!doctype html>
<meta charset="utf-8">
<title>Sign-in link cannot be used — Corridor</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; color:#111; background:#fff; font:15px/1.5 system-ui,sans-serif; }
  main { max-width:32rem; margin:4rem auto; padding:0 1.2rem 3rem; }
  h1 { font-size:1.4rem; margin:0 0 .5rem; }
  .muted { color:#666; }
  a { color:#111; }
</style>

<main>
  <h1>This sign-in link cannot be used</h1>
  <p class="muted">
    The link may have expired, already been used, or been incomplete. For your
    security, request a fresh one.
  </p>
  <p><a href="/sign-in">Request a new sign-in link</a></p>
</main>
