[project]
name = "corridor-render-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.12",
    "pillow>=12.0",
    # The rasterizer ADR-0094 selected, pinned to the version the paired-
    # rendition reader was measured with so one PDFium build serves both
    # (#735, #729). PyMuPDF stays until #741 retires the measured rollback.
    "pypdfium2==5.13.0",
    "pymupdf>=1.28",
]

[tool.uv]
package = false
