name: check

# Fast source and architecture checks. Unlike the behavior gates in test.yml
# this workflow is not path-scoped: a documentation-only change can still
# break the ADR lifecycle, amendment-graph, and INDEX.md freshness tests that
# `make check` owns, so it runs on every pull request.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Emitted as a standalone status on every pull request (branch protection
    # is not enabled on this plan; see AGENTS.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check
