name: test

on:
  pull_request:
    # Documentation-only changes cannot alter behavior these gates prove.
    # `make check` still runs on every pull request from check.yml, and it
    # owns the only tests that read documentation (tests/test_architecture.py).
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Sharded across runners: the job is CPU-bound on one four-core runner,
    # so the only remaining lever is more actual CPU (#548). Every test file
    # lands in exactly one shard, which scripts/test_shard.py proves.
    # Five, not six. Six put twelve jobs on this account at once, saturated
    # its package downloads, and two jobs stalled for minutes inside pytest.
    # Runner count is bounded by what the account will serve concurrently,
    # not by what the partition can divide, so it is raised one step at a
    # time and measured.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://corridor:corridor@localhost:5433/corridor
      CORRIDOR_HUMAN_PRINCIPAL: local:ci
      # The legacy accepted tables are written only by this login, and only
      # outside a customer environment (#492).
      CORRIDOR_LEGACY_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # One step, and no `services:` container, because this gate's wall
      # clock is the slowest of its nine jobs and so samples the worst setup
      # draw taken in the run rather than the average one. The script starts
      # the runner's own PostgreSQL 16 and installs the OCR engine
      # concurrently with the two uv syncs; it carries the measurements and
      # the reason each piece is still there (#595).
      - run: scripts/ci_environment.sh
      - run: make test-shard SHARDS=5 SHARD=${{ matrix.shard }}

  slow:
    # Sharded for the same reason as pytest (#548).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://corridor:corridor@localhost:5433/corridor
      CORRIDOR_HUMAN_PRINCIPAL: local:ci
      # The legacy accepted tables are written only by this login, and only
      # outside a customer environment (#492).
      CORRIDOR_LEGACY_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # See the pytest job: the same setup, for the same measured reason.
      - run: scripts/ci_environment.sh
      - run: make test-slow-shard SHARDS=4 SHARD=${{ matrix.shard }}
