name: test

on:
  pull_request:
    # Documentation-only changes cannot alter behavior these gates prove.
    # `make check` still runs on every pull request from check.yml, and it
    # owns the only tests that read documentation (tests/test_architecture.py).
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Sharded across runners: the job is CPU-bound on one four-core runner,
    # so the only remaining lever is more actual CPU (#548). Every test file
    # lands in exactly one shard, which scripts/test_shard.py proves.
    # Four, not six. Six was measured and the shards themselves were faster,
    # but ten concurrent test jobs saturated this account's package downloads
    # and two jobs stalled for minutes inside pytest. Runner count is bounded
    # by what the account will actually serve at once, not by the partition.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corridor
          POSTGRES_PASSWORD: corridor
          POSTGRES_DB: corridor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U corridor -d corridor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://corridor:corridor@localhost:5433/corridor
      CORRIDOR_HUMAN_PRINCIPAL: local:ci
      # The legacy accepted tables are written only by this login, and only
      # outside a customer environment (#492).
      CORRIDOR_LEGACY_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --locked
      # `make boot` provisions this; CI never did, so the first page render
      # inside a test built the worker's environment over the network, in
      # four racing xdist workers, with its output captured and invisible.
      # opencv-python-headless is locked only here, so it is never in the
      # restored uv cache either (#548).
      - run: uv sync --project workers/render --frozen
      - run: uv run alembic upgrade head
      - run: make test-shard SHARDS=4 SHARD=${{ matrix.shard }}

  slow:
    # Sharded for the same reason as pytest (#548).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corridor
          POSTGRES_PASSWORD: corridor
          POSTGRES_DB: corridor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U corridor -d corridor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://corridor:corridor@localhost:5433/corridor
      CORRIDOR_HUMAN_PRINCIPAL: local:ci
      # The legacy accepted tables are written only by this login, and only
      # outside a customer environment (#492).
      CORRIDOR_LEGACY_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --locked
      # `make boot` provisions this; CI never did, so the first page render
      # inside a test built the worker's environment over the network, in
      # four racing xdist workers, with its output captured and invisible.
      # opencv-python-headless is locked only here, so it is never in the
      # restored uv cache either (#548).
      - run: uv sync --project workers/render --frozen
      - run: uv run alembic upgrade head
      - run: make test-slow-shard SHARDS=4 SHARD=${{ matrix.shard }}
