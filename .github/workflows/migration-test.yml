name: migration-test

on:
  pull_request:
    paths:
      - "src/corridor/migrations/**"
      - "src/corridor/models.py"
      - "src/corridor/db.py"
      - "src/corridor/m8_acceptance_database.py"
      - "tests/conftest.py"
      - "tests/test_*migration*.py"
      - "tests/test_m8_acceptance_integrity.py"
      - "alembic.ini"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://corridor:corridor@localhost:5433/corridor
      CORRIDOR_HUMAN_PRINCIPAL: local:ci
      CORRIDOR_LEGACY_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The same setup the behavior gates run, for the same measured
      # reason: PostgreSQL comes from the runner image instead of a pulled
      # service container, and the OCR engine installs concurrently with the
      # uv syncs (#595).
      - run: scripts/ci_environment.sh
      - if: github.event_name == 'pull_request'
        run: make test-migrations
      - if: github.event_name != 'pull_request'
        run: make test-full
