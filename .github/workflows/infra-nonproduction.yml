# Infrastructure CI for infra/, and the deployable image.
#
# Three deliberate separations:
#
#   `plan` runs on pull requests, authenticates to nothing, and creates
#   nothing. It has no id-token permission because it never assumes a role.
#
#   `image` builds the container and exercises all three task roles against a
#   real PostgreSQL. It never pushes from a pull request.
#
#   `diff` and `deploy` are separate manual dispatches, not two steps of one
#   approved job. An environment approval granted before a job produces its own
#   diff is an approval of nothing: you approve, then the job tells you what it
#   was going to do. Run `diff`, read it, then dispatch `deploy`.
#
# Actions are pinned to commit SHAs. A tag is mutable, so `@v4` is a promise
# from someone else about what runs with access to this account.
name: infra-nonproduction

on:
  pull_request:
    paths:
      - "infra/**"
      - "Dockerfile"
      - "scripts/container_entrypoint.py"
      - ".github/workflows/infra-nonproduction.yml"
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options: [diff, deploy]
      stack:
        description: Stack to act on
        required: true
        type: choice
        options:
          # CorridorAccountFoundation is deliberately absent. It creates the
          # OIDC provider and the role this workflow assumes, so it is
          # deployed locally, once, under the MFA-protected bootstrap
          # identity. A workflow cannot bootstrap its own credential.
          - CorridorNetwork
          - CorridorData
          - CorridorApplication
      image_tag:
        description: Immutable image tag (commit SHA) for CorridorApplication
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT: "810100779593"

# One infrastructure operation at a time. Two concurrent deploys against the
# same stack race in CloudFormation, and cancelling one midway is worse than
# queueing it.
concurrency:
  group: corridor-nonproduction-infrastructure
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # No id-token: this job assumes no role and reaches no AWS API.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned toolchain
        working-directory: infra
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Tests
        working-directory: infra
        run: python -m pytest tests -q
      - name: Synth (strict, with cdk-nag)
        working-directory: infra
        run: |
          ./node_modules/.bin/cdk synth --strict --quiet \
            --context corridor:certificateArn=arn:aws:acm:us-east-2:${{ env.AWS_ACCOUNT }}:certificate/00000000-0000-0000-0000-000000000000 \
            --context corridor:imageTag=${{ github.sha }}

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corridor
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: corridor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corridor -d corridor"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build
        run: docker build -t "corridor:${{ github.sha }}" .

      # The migration is the only schema writer, and it is what creates the two
      # runtime logins from the passwords it is given.
      - name: Smoke - migration
        run: |
          docker run --rm --network host \
            -e CORRIDOR_TASK_ROLE=migration \
            -e CORRIDOR_DB_SSLMODE=disable \
            -e CORRIDOR_DB_HOST=127.0.0.1 -e CORRIDOR_DB_PORT=5432 \
            -e CORRIDOR_DB_NAME=corridor \
            -e CORRIDOR_DB_ADMIN_USERNAME=corridor \
            -e CORRIDOR_DB_ADMIN_PASSWORD=smoke \
            -e CORRIDOR_WEB_DB_PASSWORD=web-smoke-pw \
            -e CORRIDOR_WORKER_DB_PASSWORD=worker-smoke-pw \
            "corridor:${{ github.sha }}" alembic upgrade head

      - name: Smoke - the runtime logins the migration created can authenticate
        run: |
          for role in corridor_web:web-smoke-pw corridor_worker:worker-smoke-pw; do
            login="${role%%:*}"; password="${role##*:}"
            PGPASSWORD="$password" psql -h 127.0.0.1 -U "$login" -d corridor \
              -tAc "select current_user" | grep -qx "$login"
            echo "  $login authenticated"
          done

      - name: Smoke - web answers readyz
        run: |
          docker run -d --name web --network host \
            -e CORRIDOR_TASK_ROLE=web \
            -e CORRIDOR_DB_SSLMODE=disable \
            -e CORRIDOR_DB_HOST=127.0.0.1 -e CORRIDOR_DB_PORT=5432 \
            -e CORRIDOR_DB_NAME=corridor \
            -e CORRIDOR_WEB_DB_PASSWORD=web-smoke-pw \
            "corridor:${{ github.sha }}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8412/livez >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8412/livez
          curl -fsS http://127.0.0.1:8412/readyz
          docker logs web | tail -20

      - name: Smoke - batch composes its own URL and holds no other password
        run: |
          docker run --rm --network host \
            -e CORRIDOR_TASK_ROLE=batch \
            -e CORRIDOR_DB_SSLMODE=disable \
            -e CORRIDOR_DB_HOST=127.0.0.1 -e CORRIDOR_DB_PORT=5432 \
            -e CORRIDOR_DB_NAME=corridor \
            -e CORRIDOR_WORKER_DB_PASSWORD=worker-smoke-pw \
            "corridor:${{ github.sha }}" python -c "
          import os, sys
          assert 'WORKER_DATABASE_URL' in os.environ
          assert 'DATABASE_URL' not in os.environ, 'batch received the schema owner URL'
          assert not [k for k in os.environ if k.endswith('_PASSWORD')], 'raw password survived'
          print('batch role ok')
          "

      - name: Smoke - the render environment resolves offline
        run: |
          docker run --rm --network none \
            -e CORRIDOR_TASK_ROLE=batch \
            -e CORRIDOR_DB_HOST=h -e CORRIDOR_DB_PORT=5432 \
            -e CORRIDOR_DB_NAME=corridor -e CORRIDOR_WORKER_DB_PASSWORD=x \
            "corridor:${{ github.sha }}" \
            uv run --project workers/render --frozen python -c "import cv2; print(cv2.__version__)"

  diff:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'diff'
    runs-on: ubuntu-latest
    env:
      STACK: ${{ inputs.stack }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    # Bound to the environment because the role's trust condition requires it.
    # The subject is `repo:...:environment:nonproduction`, and a job with no
    # environment presents a ref-scoped subject instead, so AWS would refuse
    # the assumption outright. A separate unapproved read-only planning role
    # can come later; it is not needed for the first synthetic environment.
    environment: nonproduction
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate the image tag before it reaches a shell
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::image_tag must be a commit SHA; got '$IMAGE_TAG'"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22" }
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::810100779593:role/corridor-nonprod-cdk-deploy
          aws-region: us-east-2
      - name: Install pinned toolchain
        working-directory: infra
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Diff
        working-directory: infra
        run: |
          ./node_modules/.bin/cdk diff "$STACK" \
            --context "corridor:imageTag=$IMAGE_TAG"

  deploy:
    # main only, decided before the job starts rather than in its first shell
    # step: failing after the environment gate has already been consumed wastes
    # an approval and reads like a deployment that was attempted.
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.action == 'deploy'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      STACK: ${{ inputs.stack }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    environment: nonproduction
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate the image tag before it reaches a shell
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::image_tag must be a commit SHA; got '$IMAGE_TAG'"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22" }
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::810100779593:role/corridor-nonprod-cdk-deploy
          aws-region: us-east-2
      - name: Install pinned toolchain
        working-directory: infra
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Deploy
        working-directory: infra
        run: |
          ./node_modules/.bin/cdk deploy "$STACK" \
            --context "corridor:imageTag=$IMAGE_TAG" \
            --require-approval never \
            --outputs-file outputs.json
      - name: Record what was deployed
        working-directory: infra
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Deployed \`$STACK\`"
            echo
            echo "- commit: \`$COMMIT_SHA\`"
            echo "- image tag: \`$IMAGE_TAG\`"
            echo "- region: \`us-east-2\`"
            echo
            echo '```json'
            cat outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
