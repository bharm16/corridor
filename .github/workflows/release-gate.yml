name: release-gate

# The whole required gate, in one workflow, because the ruleset on `main` can
# only require a status that always reports.
#
# A workflow skipped by a path filter on its *trigger* leaves its checks
# pending forever, and a required check that never reports blocks the pull
# request forever. That is why `check` was the only requirable context while
# the behavior gates lived in a `paths-ignore` workflow and the migration gate
# in a `paths` one (#697). This workflow is triggered on every pull request
# and the expensive jobs are conditional *inside* it: a job skipped by an `if`
# produces a `skipped` result, which the `release-gate` summary reads through
# `needs.<job>.result` and checks against what the classifier asked for.
#
# `release-gate` is the context the ruleset requires. `check` keeps its job
# name so the context the ruleset requires today keeps reporting while the
# transition is made (ADR-0093).
#
# Job count is deliberately unchanged. `classify` and `release-gate` are the
# only additions, they run alone at each end, and neither installs a package:
# the measured ceiling on this account is concurrent package downloads, not
# runners, and eleven downloading jobs is what the previous three workflows
# already ran (#548, #595).

on:
  pull_request:

permissions:
  actions: read
  contents: read

# Standard private Linux runners have two cores. More xdist workers contend
# with PostgreSQL and render processes instead of adding CPU capacity.
env:
  TEST_WORKERS: "2"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    # Which gates this change needs. Standard library only and no `uv sync`,
    # so the one job in front of everything else costs a checkout and a
    # subprocess.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      behavior_required: ${{ steps.classify.outputs.behavior_required }}
      migration_required: ${{ steps.classify.outputs.migration_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier diffs base...head, so the merge base has to be in
          # the clone.
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify_ci_change.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Read previous validated timing reports
        if: ${{ steps.classify.outputs.behavior_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_feedback.py prepare --directory out/test-feedback-input
      - uses: actions/upload-artifact@v4
        if: ${{ steps.classify.outputs.behavior_required == 'true' }}
        with:
          name: test-feedback-input
          path: out/test-feedback-input
          if-no-files-found: error
          overwrite: true

  check:
    # Runs on every pull request, unconditionally and without waiting for the
    # classifier: `make check` owns the ADR lifecycle, amendment-graph and
    # INDEX.md freshness tests, which a documentation-only change breaks.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check
      # A local standard-library classification keeps source checks independent
      # of the classify job and avoids CDK setup on unrelated or docs-only PRs.
      - id: infrastructure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify_ci_change.py --base "$BASE_SHA" --head "$HEAD_SHA"
      # The infrastructure project rides in this job rather than taking one of
      # its own. Every gate job that installs packages is a concurrent
      # download, and eleven is the measured ceiling for this account -- ten
      # took a run from 3m28s to 11m55s (#548, #595). `check` already installs,
      # so these steps cost setup time inside an existing job instead of a
      # twelfth and thirteenth download. The image build, which is the
      # expensive half, runs in the scheduled suite.
      - uses: actions/setup-node@v4
        id: infra_node
        if: ${{ steps.infrastructure.outputs.infrastructure_required == 'true' }}
        with:
          node-version: "22"
      - name: Install the locked infrastructure toolchain
        id: infra_install
        if: ${{ steps.infrastructure.outputs.infrastructure_required == 'true' }}
        working-directory: infra
        run: |
          uv sync --frozen
          npm ci
      - name: Infrastructure assertions
        id: infra_assertions
        if: ${{ steps.infrastructure.outputs.infrastructure_required == 'true' }}
        working-directory: infra
        run: uv run python -m pytest tests --ignore=tests/test_workflow_ordering.py -q
      - name: Synth (strict, with cdk-nag)
        id: infra_synth
        if: ${{ steps.infrastructure.outputs.infrastructure_required == 'true' }}
        working-directory: infra
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          ./node_modules/.bin/cdk synth --strict --quiet \
            --context corridor:certificateArn=arn:aws:acm:us-east-2:810100779593:certificate/00000000-0000-0000-0000-000000000000 \
            --context corridor:imageTag=${{ github.sha }} \
            --context corridor:publicHostname=pilot.example.com \
            --context corridor:signInSender=no-reply@example.com

      - name: Match infrastructure results against the classifier
        if: ${{ always() }}
        env:
          INFRASTRUCTURE_REQUIRED: ${{ steps.infrastructure.outputs.infrastructure_required }}
          NODE_RESULT: ${{ steps.infra_node.outcome }}
          INSTALL_RESULT: ${{ steps.infra_install.outcome }}
          ASSERTIONS_RESULT: ${{ steps.infra_assertions.outcome }}
          SYNTH_RESULT: ${{ steps.infra_synth.outcome }}
        run: |
          set -uo pipefail
          case "$INFRASTRUCTURE_REQUIRED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo '::error::infrastructure classification is absent or invalid'; exit 1 ;;
          esac
          failed=0
          for result in "$NODE_RESULT" "$INSTALL_RESULT" "$ASSERTIONS_RESULT" "$SYNTH_RESULT"; do
            if [ "$result" != "$expected" ]; then
              printf '::error::infrastructure step is %s; expected %s\n' "${result:-<absent>}" "$expected"
              failed=1
            fi
          done
          exit "$failed"

  pytest:
    # Every file lands in exactly one shard. Each private runner has two
    # cores and uses two xdist workers; the ordinary suite uses worksteal.
    # scripts/test_shard.py proves the exact cover (ADR-0096).
    # Five, not six. Six put twelve jobs on this account at once, saturated
    # its package downloads, and two jobs stalled for minutes inside pytest.
    # Runner count is bounded by what the account will serve concurrently,
    # not by what the partition can divide, so it is raised one step at a
    # time and measured.
    needs: classify
    if: ${{ needs.classify.outputs.behavior_required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://corridor:corridor@localhost:5433/corridor
      CORRIDOR_HUMAN_PRINCIPAL: local:ci
      # The legacy accepted tables are written only by this login, and only
      # outside a customer environment (#492).
      CORRIDOR_LEGACY_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # One step, and no `services:` container, because this gate's wall
      # clock is the slowest of its nine test jobs and so samples the worst
      # setup draw taken in the run rather than the average one. The script
      # starts the runner's own PostgreSQL 16 and installs the OCR engine
      # concurrently with the two uv syncs; it carries the measurements and
      # the reason each piece is still there (#595).
      - run: scripts/ci_environment.sh
      - uses: actions/download-artifact@v4
        with:
          name: test-feedback-input
          path: out/test-feedback-input
      - run: make test-shard SHARDS=5 SHARD=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-receipt-pytest-${{ matrix.shard }}
          path: out/test-feedback
          if-no-files-found: error
          overwrite: true

  slow:
    # Keep each module on one worker: loadfile avoids repeating its expensive
    # acceptance fixtures across processes. Full coverage is unchanged.
    needs: classify
    if: ${{ needs.classify.outputs.behavior_required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://corridor:corridor@localhost:5433/corridor
      CORRIDOR_HUMAN_PRINCIPAL: local:ci
      # The legacy accepted tables are written only by this login, and only
      # outside a customer environment (#492).
      CORRIDOR_LEGACY_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # See the pytest job: the same setup, for the same measured reason.
      - run: scripts/ci_environment.sh
      - uses: actions/download-artifact@v4
        with:
          name: test-feedback-input
          path: out/test-feedback-input
      - run: make test-slow-shard SHARDS=4 SHARD=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-receipt-slow-${{ matrix.shard }}
          path: out/test-feedback
          if-no-files-found: error
          overwrite: true

  migration:
    # The migration-adjacent path set the retired `migration-test.yml`
    # trigger carried, now asked of the classifier instead.
    needs: classify
    if: ${{ needs.classify.outputs.migration_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://corridor:corridor@localhost:5433/corridor
      CORRIDOR_HUMAN_PRINCIPAL: local:ci
      CORRIDOR_LEGACY_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The same setup the behavior gates run, for the same measured reason
      # (#595).
      - run: scripts/ci_environment.sh
      - uses: actions/download-artifact@v4
        with:
          name: test-feedback-input
          path: out/test-feedback-input
      - run: make test-migrations
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-receipt-migration-1
          path: out/test-feedback
          if-no-files-found: error
          overwrite: true

  release-gate:
    # The required context. It fails closed: every job result is matched
    # against exactly what the classifier asked for, never against
    # `success or skipped`, because that would let a behavior job skipped by
    # a broken `if` condition report green -- a red gate that looks green is
    # worse than no required check at all.
    if: ${{ always() }}
    needs: [classify, check, pytest, slow, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Match every job result against the classifier
        env:
          BEHAVIOR_REQUIRED: ${{ needs.classify.outputs.behavior_required }}
          MIGRATION_REQUIRED: ${{ needs.classify.outputs.migration_required }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          SLOW_RESULT: ${{ needs.slow.result }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
        # No `${{ }}` in this body on purpose: every value arrives through
        # `env` above, which keeps the script exactly what
        # tests/test_ci_policy.py executes.
        run: |
          set -uo pipefail

          failed=0

          require() {
            if [ "$2" = "$3" ]; then
              printf '%s = %s\n' "$1" "$2"
            else
              printf '::error::%s is %s; the release gate requires %s\n' "$1" "${2:-<absent>}" "$3"
              failed=1
            fi
          }

          # Sets `expected`. An answer that is neither `true` nor `false`
          # is a classifier the summary cannot trust, so it fails the gate
          # rather than picking a default.
          expected_for() {
            case "$2" in
              true) expected=success ;;
              false) expected=skipped ;;
              *)
                printf '::error::%s is %s; the classifier must answer true or false\n' "$1" "${2:-<absent>}"
                expected=unclassified
                failed=1
                ;;
            esac
          }

          require classify "$CLASSIFY_RESULT" success
          require check "$CHECK_RESULT" success

          expected_for behavior_required "$BEHAVIOR_REQUIRED"
          require pytest "$PYTEST_RESULT" "$expected"
          require slow "$SLOW_RESULT" "$expected"

          expected_for migration_required "$MIGRATION_REQUIRED"
          require migration "$MIGRATION_RESULT" "$expected"

          if [ "$failed" -ne 0 ]; then
            printf '::error::release gate failed closed\n'
            exit 1
          fi
          printf 'release gate satisfied\n'
      - uses: actions/checkout@v4
        if: ${{ success() && needs.classify.outputs.behavior_required == 'true' }}
      - uses: actions/download-artifact@v4
        if: ${{ success() && needs.classify.outputs.behavior_required == 'true' }}
        with:
          name: test-feedback-input
          path: out/test-feedback-input
      - uses: actions/download-artifact@v4
        if: ${{ success() && needs.classify.outputs.behavior_required == 'true' }}
        with:
          pattern: test-receipt-*
          merge-multiple: true
          path: out/test-feedback-receipts
      - name: Enforce the measured feedback budget
        if: ${{ success() && needs.classify.outputs.behavior_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTEST_SHARDS: "5"
          SLOW_SHARDS: "4"
          MIGRATION_REQUIRED: ${{ needs.classify.outputs.migration_required }}
        run: >-
          python3 scripts/ci_feedback.py finish
          --input out/test-feedback-input
          --receipts out/test-feedback-receipts
          --output out/test-feedback/report.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('out/test-feedback/report.json') != '' }}
        with:
          name: test-feedback
          path: out/test-feedback/report.json
          if-no-files-found: error
          overwrite: true
