# WSDOT contract 9424 — SR 509 Completion Stage 1B, Appendix U
#
# The unsealed half of the pair. Contract 9540 next door is M7's holdout
# (corpus/wsdot-9540.yaml, sealed); this is the same agency's Appendix U on
# the same Puget Sound Gateway corridor, and it is what WSDOT layout work
# is developed against.
#
# The pairing is the point. A seal only holds while there is somewhere
# else to do the work — SR 789 was spent partly because it was the only
# FDOT matrix in the corpus for a while. Everything learned here is
# transferable and none of it costs the holdout.
#
# Not a corridor anyone is tracking. Layout evidence, like
# corpus/cross-agency.yaml.
