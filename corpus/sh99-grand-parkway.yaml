# Project C — TxDOT SH 99 Grand Parkway Segment B-1 (development corpus)
#
# Decision on #3: this project is developed against freely; FDOT SR 789 is
# the sealed eval holdout. The meeting notes here are the only utility
# coordination minutes anywhere in the public corpus — 145 dated, per-owner
# notes on a biweekly cadence, Apr 2024 to May 2025.
#
# Entries below the marker are generated from the archive listing itself
# (145 files is not hand-typing territory); regenerate rather than editing
# them one by one. Deferred, deliberately: the two RULIS permit-status zips
# (342 MB + 375 MB nested; permit status is M4+ material) and
# "Utility Owner Information.zip" (23 MB).
project: sh99-grand-parkway
name: SH 99 Grand Parkway Segment B-1
agency: TxDOT

